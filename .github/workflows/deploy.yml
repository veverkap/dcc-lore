name: Deploy Quartz Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetches full history for accurate note modification dates

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Fetch Core Plugins
        run: npx quartz plugin install --from-config

      - name: Compile Lore Graph
        run: npx quartz build

      - name: Upload Static Web Assets
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Publish to GitHub Pages Live Link
        id: deployment
        uses: actions/deploy-pages@v5